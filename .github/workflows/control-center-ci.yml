name: Control Center CI

on:
  pull_request:
    paths:
      - "control-center/**"
      - ".github/workflows/control-center-ci.yml"
  push:
    branches:
      - main
    paths:
      - "control-center/**"
      - ".github/workflows/control-center-ci.yml"

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-center
    steps:
      - uses: actions/checkout@v7
        with:
          # This job never pushes; do not leave GITHUB_TOKEN in .git while npm scripts run.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: control-center/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Browser smoke QA on uncredentialed loopback preview
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)"
          if [[ -z "$CHROME_PATH" || ! -x "$CHROME_PATH" ]]; then
            echo "::error::No system Chromium/Chrome available; browser QA must not silently skip"
            exit 1
          fi
          export CHROME_PATH
          npm run smoke:mobile
          npm run smoke:truth
          npm run smoke:office
          npm run smoke:production
      - name: Verify no browser-secret env contract
        run: |
          ! grep -R "VELVETOS_CONTROL_API_TOKEN" dist
          ! grep -R "X-VelvetOS-Token" dist
      - name: Canary build rejects embedded credentials
        shell: bash
        run: |
          set -euo pipefail
          token_canary="canary-token-$(openssl rand -hex 16)"
          fleet_canary="canary-fleet-$(openssl rand -hex 16)"
          base_canary="https://canary.invalid/$(openssl rand -hex 8)"
          rm -rf dist
          VELVETOS_CONTROL_API_TOKEN="$token_canary" \
          VELVETOS_FLEET_READONLY_TOKEN="$fleet_canary" \
          VITE_CONTROL_API_BASE="$base_canary" \
            npm run build
          fail=0
          while IFS= read -r -d '' file; do
            if grep -F -q -e "$token_canary" -e "$fleet_canary" -e "$base_canary" \
                -e "Bearer " -e "metadata.google.internal" -e "VELVETOS_" "$file"; then
              echo "::error::embedded credential marker in ${file#dist/}"
              fail=1
            fi
          done < <(find dist -type f -print0)
          exit "$fail"
