name: Core Runtime Smoke

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".cursor/environment.json"
      - ".cursor/vf-desk.json"
      - ".cursor/rules/**"
      - "instance/**"
      - "INSTANCE.json"
      - "AGENTS.md"
      - "core.lock.yml"
      - "control-center/fixtures/**"
      - "control-center/src/core-snapshot-contract.test.ts"
      - ".github/workflows/core-runtime-smoke.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".cursor/environment.json"
      - ".cursor/vf-desk.json"
      - ".cursor/rules/**"
      - "instance/**"
      - "INSTANCE.json"
      - "AGENTS.md"
      - "core.lock.yml"
      - "control-center/fixtures/**"
      - "control-center/src/core-snapshot-contract.test.ts"
      - ".github/workflows/core-runtime-smoke.yml"
  workflow_dispatch:
  schedule:
    # Detect Core main contract drift even when this repo receives no commits.
    - cron: "17 3 * * *"

jobs:
  verify-attached-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v7

      # Same runtime as Core's own sensor CI (check-all.yml): Python 3.11 +
      # requirements-sensors.txt + ffmpeg. Without these, Core check-all fails
      # on missing PIL/cryptography (the cause of every red run since 2026-09-14).
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # nocturney/velvetos-core is PRIVATE; this repo's GITHUB_TOKEN cannot read it.
      # Owner-provided secret: fine-grained token, Contents: Read-only, scoped to
      # nocturney/velvetos-core only (see docs/CI-CORE-ACCESS.md).
      - name: Require Core read token
        env:
          VELVETOS_CORE_READ_TOKEN: ${{ secrets.VELVETOS_CORE_READ_TOKEN }}
        run: |
          if [ -z "$VELVETOS_CORE_READ_TOKEN" ]; then
            echo "::error title=Missing secret VELVETOS_CORE_READ_TOKEN::Add repository secret VELVETOS_CORE_READ_TOKEN (fine-grained token, Contents: Read-only on nocturney/velvetos-core only). nocturney/velvetos-core is private and GITHUB_TOKEN cannot clone it. See docs/CI-CORE-ACCESS.md."
            exit 1
          fi
          echo "VELVETOS_CORE_READ_TOKEN present (value masked)."

      # Clone Core exactly where attach-core.sh expects it (vendor/velvetos-core
      # with .git on branch main). actions/checkout masks the token and persists it
      # only for this checkout, so attach-core.sh / verify-core.sh `git fetch` work.
      - name: Checkout private Core main
        uses: actions/checkout@v7
        with:
          repository: nocturney/velvetos-core
          ref: main
          path: vendor/velvetos-core
          token: ${{ secrets.VELVETOS_CORE_READ_TOKEN }}
          # Full history, same as Core's own check-all CI: some Core sensors
          # (e.g. check-zero-cost-final-acceptance.py) verify recorded commits
          # are ancestors of HEAD, which a depth-1 clone cannot answer.
          fetch-depth: 0

      - name: Attach and verify current Core main
        run: bash scripts/attach-core.sh

      - name: Verify canonical Core v1 snapshot shape against committed fixture
        run: python3 scripts/generate-core-snapshot-fixture.py --core vendor/velvetos-core --verify

      - name: Install Core sensor runtime dependencies
        if: github.event_name != 'schedule'
        run: |
          python3 -m pip install --disable-pip-version-check -r vendor/velvetos-core/requirements-sensors.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Full Core verification
        if: github.event_name != 'schedule'
        run: bash scripts/verify-core.sh --full
